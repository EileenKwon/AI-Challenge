name: 기능 작업
description: 새 기능이나 구조 개선 작업을 제안합니다.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 해결할 문제와 사용자 가치를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 변경 예정 모듈과 제외 범위를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 테스트 가능한 체크리스트로 적어주세요.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 안전·PII·정책 영향
      description: 금액 계산, 결측값, PII, 정책 근거에 미치는 영향을 적어주세요.
