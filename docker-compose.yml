services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DN_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DN_SECRET_KEY=${DN_SECRET_KEY:-change-me}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
