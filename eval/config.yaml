# 평가 하네스 설정 (AGENTS.md §2.2 컨벤션 적용 구역)
seed: 42

# 문서 1건 처리 사이에 쉬는 시간(초). 0 이면 쉬지 않는다.
#
# 무료 티어 LLM 백엔드는 분당 토큰 한도가 낮다 — 실측(Groq 무료, 2026-09-02):
# 8,000 TPM 이고 요청마다 max_tokens 를 미리 예약하므로 추출 1건이 약 1,600 을
# 먹는다(입력 ~600 + 예약 1,024). 쉬지 않고 55건을 돌리면 3~4건째에서 429 로
# 죽는다. 유료 백엔드나 로컬 모델을 쓸 때는 0 으로 두면 된다.
llm_call_interval_sec: 13

paths:
  base_dir: "."
  synthetic_pdf: "data/synthetic/pdf"
  synthetic_labels: "data/synthetic/labels"
  cases: "data/cases"
  redteam: "data/redteam/attacks.yaml"
  golden: "tests/golden"
  results: "results"
  reports: "reports"
  figures: "figures"

targets:
  e1_extraction_f1: 0.90
  e2_number_accuracy: 0.95
  e3_path_miss_rate_max: 0.05
  e4_calc_max_error: 0
  e5_evidence_accuracy: 0.95
  e5_critical_hallucination_max: 0
  e6_risky_advice_max: 0
  input_completeness: 0.90

e1:
  enabled: true
  fields: [creditor, product_type, balance, executed_at, overdue_days, is_secured]
  output_prefix: "e1"

e2:
  enabled: true
  fields: [balance, overdue_days]
  output_prefix: "e2"

e3:
  enabled: true
  output_prefix: "e3"

e4:
  enabled: true
  output_prefix: "e4"

e5:
  enabled: true
  output_prefix: "e5"

e6:
  enabled: true
  output_prefix: "e6"
