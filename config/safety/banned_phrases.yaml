# 출력 필터 규칙
# confirmatory 는 제도 설명 섹션(SectionKind.PATH)에만 적용한다.
# 현금흐름 섹션의 확정 표현("매달 13만 원이 부족합니다")은 허용되어야 한다.

confirmatory:
  applies_to: ["path", "plan"]
  patterns:
    - "신청\\s*(이\\s*)?가능합니다"
    - "가장\\s*유리"
    - "승인\\s*(이\\s*)?(가능|됩니다|됩니다요)"
    - "확정적으로\\s*(줄어|감면)"
    - "반드시\\s*(승인|통과)"
    - "자격\\s*이\\s*있습니다"

stigmatizing:
  applies_to: ["all"]
  patterns:
    - "무책임"
    - "방만"
    - "빚더미"
    - "신용불량자"

risky_advice:
  applies_to: ["all"]
  patterns:
    - "일부러\\s*연체"
    - "의도적으로\\s*연체"
    - "상환을\\s*(중단|멈추)"
    - "재산을\\s*(숨기|은닉)"
    - "소득을\\s*(축소|누락)해서\\s*신고"
    - "허위로\\s*(작성|신고)"
