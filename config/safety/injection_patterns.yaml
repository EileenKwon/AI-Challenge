# 문서 내 삽입형 프롬프트 인젝션 탐지 패턴
# 탐지 시 해당 라인만 제거하고 문서 전체를 거부하지 않는다.

patterns:
  - "(이전|위의).{0,10}(지시|명령|프롬프트).{0,10}(무시|잊)"
  - "ignore\\s+(all\\s+)?(previous|prior)\\s+instructions"
  - "system\\s*prompt"
  - "시스템\\s*프롬프트"
  - "you\\s+are\\s+now"
  - "너는\\s*이제"
  - "규칙\\s*엔진.{0,10}(조건|내용).{0,10}(출력|알려)"
  - "<\\s*/?\\s*(system|assistant)\\s*>"
