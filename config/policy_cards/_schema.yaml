# 정책 카드 JSON Schema (jsonschema 로 검증)
$schema: "http://json-schema.org/draft-07/schema#"
type: object
required: [id, version, name, agency, verified, policy_base_date, source, conditions]
properties:
  id: { type: string }
  version: { type: string }
  name: { type: string }
  agency: { type: string }
  target: { type: string }
  priority: { type: integer }
  verified: { type: boolean }
  policy_base_date: { type: string }
  last_reviewed: { type: string }
  source:
    type: object
    required: [title, url, retrieved_at]
    properties:
      title: { type: string }
      url: { type: string }
      retrieved_at: { type: string }
  conditions:
    type: array
    items:
      type: object
      required: [id, label, field, op, required]
      properties:
        id: { type: string }
        label: { type: string }
        field: { type: string }
        op:
          type: string
          enum: [between, lte, gte, lt, gt, eq, in, is_true, is_false, exists]
        value: {}
        required: { type: boolean }
  exclusions: { type: array }
  required_inputs: { type: array, items: { type: string } }
  documents: { type: array, items: { type: string } }
  consult_questions: { type: array, items: { type: string } }
  swing_factors: { type: array, items: { type: string } }
  why_final_check: { type: string }
  changelog: { type: array }
