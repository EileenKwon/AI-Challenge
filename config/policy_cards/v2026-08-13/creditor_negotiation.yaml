# 채권금융회사 상환조건 변경 문의
# 공식 채무조정 제도가 아니라 개별 금융회사와의 협의 경로다.

id: creditor_negotiation
version: "2026-08-13.2"
name: 채권금융회사 상환조건 변경 문의
agency: 각 채권금융회사
target: 채무를 보유한 모든 이용자
priority: 4

verified: true
policy_base_date: "2026-08-13"
last_reviewed: "2026-08-21"

source:
  title: "개별 금융회사 협의 경로 (공식 채무조정 제도 아님)"
  url: "https://www.fss.or.kr/fss/main/main.do"
  retrieved_at: "2026-08-21"

conditions:
  - id: has_any_debt
    label: 채무를 보유한 금융회사가 1곳 이상 존재
    field: total_debt
    op: gt
    value: 0
    required: true

exclusions: []

required_inputs:
  - total_debt

documents:
  - 신분증
  - 소득증빙서류

consult_questions:
  - 만기연장이 가능한가
  - 상환유예를 신청할 수 있는가
  - 상환방식(원리금균등·원금균등 등) 변경이 가능한가
  - 변경 시 신용정보에 어떻게 기록되는가

swing_factors:
  - 금융회사별 내부 기준
  - 연체 발생 여부와 기간

notes:
  - >
    공식 채무조정 제도가 아니므로 감면 효과를 보장하지 않는다.
    다만 연체 전 단계에서 가장 먼저 시도할 수 있는 경로이므로 항상 후보에 포함한다.

why_final_check: >
  상환조건 변경 가능 여부는 각 금융회사의 개별 심사 사항이며 회사마다 결과가 다르다.

changelog:
  - date: "2026-08-13"
    change: 최초 작성 (미검증 상태)
  - date: "2026-08-21"
    change: 성격 명확화 — 공식 제도가 아닌 개별 협의 경로임을 명시, verified true 전환
