# 주의: verified 는 공식 출처 대조를 완료하기 전까지 반드시 false 로 둔다.
#       연체일수 구간 외의 조건(총채무액 한도, 소득 요건 등)은
#       근거를 확인하기 전에 임의로 채우지 않는다. value: TODO 로 남긴다.

id: sinsok_debt_adjustment
version: "2026-08-13.1"
name: 신속채무조정
agency: 신용회복위원회
target: 연체 30일 이하(단기연체 우려) 채무자
priority: 1

verified: false                 # TODO: 공식 출처 대조 후 true
policy_base_date: "2026-08-13"
last_reviewed: "2026-08-13"

source:
  title: "신용회복위원회 채무조정 제도 안내"
  url: "TODO"                   # 추측해서 채우지 말 것
  retrieved_at: "TODO"

conditions:
  - id: overdue_range
    label: 연체일수 30일 이하
    field: max_overdue_days
    op: lte
    value: 30
    required: true

  - id: income_continuity
    label: 계속적·반복적 소득 존재
    field: has_continuous_income
    op: is_true
    required: true

  # TODO: 총채무액 한도, 채권금융회사 협약 여부 등
  #       공식 출처에서 확인한 조건만 추가한다.

exclusions:
  - id: court_proceeding
    label: 개인회생·개인파산 절차 진행 중
    field: court_proceeding_ongoing
    op: is_true

required_inputs:
  - max_overdue_days
  - has_continuous_income

documents:
  - 신분증
  - 소득증빙서류
  - 채무 관련 서류

consult_questions:
  - 보유한 채무가 모두 조정 대상에 포함되는가
  - 예상 납입기간은 어느 정도인가
  - 연체가 더 진행되기 전에 신청 가능한 시점은 언제인가

swing_factors:
  - 최근 6개월 이내 신규채무의 금액과 비율
  - 소득증빙 가능 여부
  - 보유 재산과 임차보증금

why_final_check: >
  신청 가능 여부와 조정 조건은 신용회복위원회의 상담과 심사를 통해 확정된다.
  본 서비스의 결과는 상담 준비를 위한 1차 검토다.

changelog:
  - date: "2026-08-13"
    change: 최초 작성 (미검증 상태)
