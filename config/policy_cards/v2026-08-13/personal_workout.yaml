# 2026-08-21 에 unresolved 로 보존했던 총채무액 한도 충돌을 2026-09-02 에 해소했다.
# 결론은 15억원(무담보 5억 / 담보 10억) — 제도 상세 페이지 원문 값이다.
resolved_conflicts:
  - id: total_debt_cap
    resolved_at: "2026-09-02"
    adopted:
      total: 1500000000
      unsecured: 500000000
      secured: 1000000000
      source: "제도 상세 페이지 (MENU_ID=1930)"
    rejected:
      total: 2500000000
      unsecured: 1000000000
      secured: 1500000000
      source: "제도 비교 페이지 (MENU_ID=490) 를 읽고 기록했던 값"
    reason: >
      비교 페이지(MENU_ID=490) 는 신복위 3개 제도가 같은 한도를 쓰는 칸을 병합(colspan)해
      표시한다. 병합 칸을 열 단위로 펴서 읽으면 값이 한 칸씩 밀려 개인워크아웃 열에
      다른 제도의 값이 들어온다 — 2026-09-02 재확인에서 같은 표를 다시 파싱했을 때도
      '사전채무조정 25억 / 개인워크아웃 제한없음' 이라는 서로 다른 밀림이 재현되었다.
      즉 2026-08-21 에 기록한 '개인워크아웃 25억' 은 비교표의 공식 값이 아니라 표 오독이다.
      한편 25억(무담보 10억 / 담보 15억) 은 법원 개인회생의 채무한도
      (채무자회생법 제579조 제4호) 와 정확히 일치해, 비교표의 개인회생 칸에서 밀려온
      값으로 설명된다.
    corroboration:
      - "제도 상세 페이지 원문: '채권금융회사 총 채무액 15억원(무담보 5억원, 담보 10억원) 이하'"
      - "같은 저장소의 sinsok_debt_adjustment / pre_debt_adjustment 카드도 동일하게 15억(5억/10억) 을 인코딩하고 있다"
    residual_risk: >
      채택값 15억은 두 후보 중 더 엄격한 쪽이라, 틀렸더라도 자격 없는 사용자를
      자격 있다고 표시하는 방향의 오류는 생기지 않는다. 반대 방향(15억~25억 구간
      채무자가 NEEDS_INFO/EXCLUDED 로 표시)의 오류 가능성은 남으므로, 상담 질문에
      한도 기준 확인 항목을 그대로 유지한다.
    action_required: "신용회복위원회(1600-5500) 전화 확인으로 최종 확정(선택). 현재 인코딩은 공식 웹 원문 기준."

conditions:
  - id: overdue_range
    label: 연체일수 90일 이상
    field: max_overdue_days
    op: gte
    value: 90
    required: true
    source_quote: "연체기간 90일 이상"

  - id: total_debt_cap
    label: 채권금융회사 총 채무액 15억원 이하
    field: total_debt
    op: lte
    value: 1500000000
    required: true
    source_quote: "채권금융회사 총 채무액 15억원(무담보 5억원, 담보 10억원) 이하"

  - id: unsecured_cap
    label: 무담보 채무 5억원 이하
    field: unsecured_debt
    op: lte
    value: 500000000
    required: true
    source_quote: "무담보 5억원"

  - id: secured_cap
    label: 담보 채무 10억원 이하
    field: secured_debt
    op: lte
    value: 1000000000
    required: true
    source_quote: "담보 10억원"

  - id: recent_debt_ratio
    label: 최근 6개월 이내 신규채무 원금이 총 채무원금의 30% 미만
    field: recent_debt_ratio
    op: lt
    value: 0.30
    required: true
    source_quote: "최근 6개월 내 새로 생긴 채무 원금이 총 채무원금의 30% 미만"

exclusions:
  - id: court_proceeding
    label: 개인회생·개인파산 절차 진행 중
    field: court_proceeding_ongoing
    op: is_true

required_inputs:
  - max_overdue_days
  - total_debt
  - unsecured_debt
  - secured_debt

documents:
  - 신분증
  - 소득증빙서류
  - 채무 관련 서류

consult_questions:
  - 총 채무액 한도 기준이 현재 어떻게 적용되는가
  - 원금 감면은 어느 범위까지 가능한가
  - 신청 이후 추심은 언제부터 중단되는가

swing_factors:
  - 총 채무액이 한도 기준에 근접하는지 여부
  - 최근 6개월 이내 신규채무의 금액과 비율
  - 상각채권 여부에 따른 원금 감면율 차이

notes:
  - "지원 내용: 연체이자·이자 전액 감면, 원금 감면(미상각 최대 30%, 상각 20~70%), 무담보 최장 8년 분할, 주택담보 최장 35년, 신청 다음날부터 추심 중단."

why_final_check: >
  연체 90일 이상은 본 서비스가 자동 판정하지 않고 전문기관 상담으로 연결하는 구간이다.
  최종 자격과 감면 범위는 신용회복위원회의 상담과 심사로 확정된다.

changelog:
  - date: "2026-08-13"
    change: 최초 작성 (미검증 상태)
  - date: "2026-08-21"
    change: >
      연체구간·신규채무 비율 조건 공식 출처 대조 완료.
      총채무액 한도는 출처 간 값 충돌로 unresolved 에 보존하고 조건 인코딩 보류.
  - date: "2026-09-02"
    change: >
      총채무액 한도 충돌 해소 — 비교표 병합칸 오독이 원인임을 재현으로 확인하고
      제도 상세 페이지 원문값(15억 / 무담보 5억 / 담보 10억)을 조건으로 인코딩.
      카드를 verified: true 로 승격. 상세는 resolved_conflicts 참고.
