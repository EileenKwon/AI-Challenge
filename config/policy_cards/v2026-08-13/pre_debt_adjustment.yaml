# 사전채무조정 (프리워크아웃)
# 공식 출처 대조 완료 — 2026-08-21

id: pre_debt_adjustment
version: "2026-08-13.2"
name: 사전채무조정
agency: 신용회복위원회
target: 연체 31~89일 구간의 채무자
priority: 2

verified: true
policy_base_date: "2026-08-13"
last_reviewed: "2026-08-21"

source:
  title: "신용회복위원회 채무조정 제도 비교 — 사전채무조정"
  url: "https://www.ccrs.or.kr/cms/com/index.do?MENU_ID=490"
  retrieved_at: "2026-08-21"

conditions:
  - id: overdue_range
    label: 연체일수 31일 이상 89일 이하
    field: max_overdue_days
    op: between
    value: [31, 89]
    required: true
    source_quote: "연체기간 31~89일인 채무자"

  - id: total_debt_cap
    label: 채권금융회사 총 채무액 15억원 이하
    field: total_debt
    op: lte
    value: 1500000000
    required: true
    source_quote: "총 채무액 15억원(무담보 5억원, 담보 10억원) 이하"

  - id: unsecured_cap
    label: 무담보 채무 5억원 이하
    field: unsecured_debt
    op: lte
    value: 500000000
    required: true
    source_quote: "무담보 5억원"

  - id: secured_cap
    label: 담보 채무 10억원 이하
    field: secured_debt
    op: lte
    value: 1000000000
    required: true
    source_quote: "담보 10억원"

  - id: recent_debt_ratio
    label: 최근 6개월 이내 신규채무 원금이 총 채무원금의 30% 미만
    field: recent_debt_ratio
    op: lt
    value: 0.30
    required: true
    source_quote: "최근 6개월 이내 새로 생긴 채무 원금이 총 채무원금의 30% 미만"

  - id: income_continuity
    label: 계속적·반복적 소득 존재
    field: has_continuous_income
    op: is_true
    required: true

  - id: income_proof
    label: 소득증빙 가능 여부
    field: income_proof_available
    op: is_true
    required: true

exclusions:
  - id: court_proceeding
    label: 개인회생·개인파산 절차 진행 중
    field: court_proceeding_ongoing
    op: is_true

required_inputs:
  - max_overdue_days
  - total_debt
  - unsecured_debt
  - secured_debt

documents:
  - 신분증
  - 소득증빙서류
  - 채무 관련 서류

consult_questions:
  - 보유한 채무가 모두 조정 대상에 포함되는가
  - 예상 납입기간은 어느 정도인가
  - 담보채무는 별도로 어떻게 처리되는가

swing_factors:
  - 최근 6개월 이내 신규채무의 금액과 비율
  - 소득증빙 가능 여부
  - 보유 재산과 임차보증금

why_final_check: >
  신청 가능 여부와 조정 조건은 신용회복위원회의 상담과 심사를 통해 확정된다.
  본 서비스의 결과는 상담 준비를 위한 1차 검토다.

changelog:
  - date: "2026-08-13"
    change: 최초 작성 (미검증 상태)
  - date: "2026-08-21"
    change: 공식 출처 대조 완료 — 조건 확정, verified true 전환
