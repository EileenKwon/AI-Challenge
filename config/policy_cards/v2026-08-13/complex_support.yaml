consult_questions:
  - 채무상담과 고용지원을 한 창구에서 함께 받을 수 있는가
  - 생계비 지원과 채무조정을 병행할 수 있는가
  - 불법추심에 대한 법률지원을 받을 수 있는가

swing_factors:
  - 실직·폐업 시점과 지속 기간
  - 부양가족 수

notes:
  - >
    신용회복위원회는 채무상담과 함께 금융·고용·복지·법률 공공서비스를 연계하는
    복합지원 체계를 운영한다. 본 서비스는 지원 자격을 심사하지 않고 필요한
    지원 분야와 공식 상담 경로만 제시한다.
  - >
    실직·폐업 신호는 신속채무조정의 '연체 없는 특례 경로' 사유와도 겹친다.
    두 안내가 함께 노출되도록 한다.

why_final_check: >
  각 지원 제도의 자격은 해당 기관의 심사로 확정된다.

