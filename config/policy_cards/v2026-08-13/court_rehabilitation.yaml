# 법원 개인회생·개인파산 전문상담
# 본 서비스는 자격을 판정하지 않고 상담 연결만 안내한다.

id: court_rehabilitation
version: "2026-08-13.2"
name: 법원 개인회생·개인파산 전문상담
agency: 관할 법원 / 대한법률구조공단
target: 상환여력이 없거나 채무 규모가 과중한 채무자
priority: 5

verified: true
policy_base_date: "2026-08-13"
last_reviewed: "2026-08-21"

source:
  title: "대한민국 법원 개인회생·파산 안내"
  url: "https://www.scourt.go.kr/nm/min_2/min_2_7/index.html"
  retrieved_at: "2026-08-21"

conditions:
  - id: referral_only
    label: 자격을 판정하지 않고 전문상담으로 연결
    field: total_debt
    op: exists
    required: false

exclusions: []

required_inputs: []

documents:
  - 법률상담 시 안내

consult_questions:
  - 개인회생과 개인파산 중 어느 절차가 적합한가
  - 변제계획 인가까지 어느 정도 기간이 걸리는가
  - 보유 재산은 절차에서 어떻게 처리되는가
  - 보험 해약환급금이 청산가치에 어떻게 반영되는가

swing_factors:
  - 계속적 소득 유무
  - 보유 재산 규모
  - 채무 성격(보증채무·조세채무 포함 여부)

notes:
  - >
    개인회생·개인파산은 법원이 인가하는 절차다. 신용회복위원회 채무조정과
    관할·절차·효과가 모두 다르므로 본 서비스는 구분해 안내하고 자격은 판정하지 않는다.

why_final_check: >
  법원 절차의 자격과 결과는 관할 법원의 심리로만 확정된다.

