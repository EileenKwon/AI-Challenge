# 3단계 누락정보 확인 — 고정 5문항 + 조건부 3문항 (기획서 3단계, T07)
# text/helper 는 화면에 보이는 문구다(생활 언어). qid·kind·트리거 이름 등
# 도메인 필드는 바꾸지 않는다 — 트리거 평가 로직은 reconcile/questions.py 에 있다.
# (2026-09-06 UX 개편: 질문 문구를 쉬운 말로, helper 로 예시를 덧붙임)

fixed:
  - qid: Q1_INCOME
    text: 월 실수령소득을 알려주세요
    helper: 세금 등을 제외하고 실제로 받는 한 달 소득을 입력해 주세요.
    kind: money
    required: true
    skippable: false
  - qid: Q2_LIVING_COST
    text: 한 달에 꼭 필요한 생활비는 얼마인가요?
    helper: 최근 2~3개월의 실제 지출을 기준으로 입력해 주세요.
    kind: money
    required: true
    skippable: true
    skip_impact: 필수생활비가 미확인으로 남아 월 상환여력 계산에 0원으로 반영되고, 추가 확인이 필요한 항목으로 표시됩니다.
  - qid: Q3_INCOME_PROOF
    text: 최근 3개월의 소득을 확인할 수 있는 자료가 있나요?
    helper: 급여명세서, 급여 입금내역, 소득금액증명 등이 해당될 수 있습니다.
    kind: bool
    required: true
    skippable: true
    skip_impact: 소득증빙 요건이 미확인으로 남아 관련 제도 판정에 추가 확인 필요 표시가 발생합니다.
  - qid: Q4_DEPENDENTS
    text: 부양가족은 몇 명인가요?
    helper: 없으면 0을 입력해 주세요.
    kind: int
    required: false
    skippable: true
    skip_impact: 부양가족 수가 0으로 가정되지 않고 미확인으로 남습니다.
  - qid: Q6_CONTINUOUS_INCOME
    text: 현재 정기적으로 들어오는 소득이 있나요?
    helper: 근로소득, 사업소득처럼 계속해서 반복적으로 들어오는 소득을 말합니다.
    kind: bool
    required: true
    skippable: true
    skip_impact: 신용회복위원회 제도 공통 요건인 계속적 소득 여부가 미확인으로 남아 모든 제도가 추가 확인 필요로 표시됩니다.
  - qid: Q5_RECENT_DEBT
    text: 최근 6개월 안에 새로 받은 대출이나 채무가 있나요?
    kind: bool
    required: false
    skippable: true
    skip_impact: 최근 신규채무 비율을 계산할 수 없어 상담 시 재확인이 필요합니다.

conditional:
  - qid: C1_COLLATERAL
    text: 보유하고 계신 부동산, 자동차, 임차보증금이 있나요?
    kind: bool
    required: false
    conditional_on: has_secured_debt
    skippable: true
    skip_impact: 담보채무 관련 제도 판정에 필요한 재산 정보가 미확인으로 남습니다.
  - qid: C2_COLLECTION
    text: 현재 추심 연락을 받고 계신가요?
    kind: bool
    required: false
    conditional_on: has_overdue
    skippable: true
    skip_impact: 전문상담 우선 연결(트리아지) 판단에 사용되는 신호가 누락됩니다.
  - qid: C3_INCOME_DROP
    text: 최근에 실직이나 휴업, 폐업을 겪으셨나요?
    kind: bool
    required: false
    conditional_on: income_drop_signal
    skippable: true
    skip_impact: 복합지원 상담 연계 여부 판단에 필요한 신호가 누락됩니다.
