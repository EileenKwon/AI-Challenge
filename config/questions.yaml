# 3단계 누락정보 확인 — 고정 5문항 + 조건부 3문항 (기획서 3단계, T07)
# 문구는 기획서 원문을 그대로 따른다. 트리거 평가 로직은 reconcile/questions.py 에 있다.

fixed:
  - qid: Q1_INCOME
    text: 월 실수령소득은 얼마인가?
    kind: money
    required: true
    skippable: false
  - qid: Q2_LIVING_COST
    text: 주거비를 포함한 월 필수생활비는 대략 얼마인가?
    kind: money
    required: true
    skippable: false
  - qid: Q3_INCOME_PROOF
    text: 최근 3개월 이상 소득증빙이 가능한가?
    kind: bool
    required: true
    skippable: true
    skip_impact: 소득증빙 요건이 미확인으로 남아 관련 제도 판정에 추가 확인 필요 표시가 발생합니다.
  - qid: Q4_DEPENDENTS
    text: 부양가족이 있는가?
    kind: int
    required: false
    skippable: true
    skip_impact: 부양가족 수가 0으로 가정되지 않고 미확인으로 남습니다.
  - qid: Q6_CONTINUOUS_INCOME
    text: 근로소득·사업소득 등 계속적·반복적인 소득이 있는가?
    kind: bool
    required: true
    skippable: true
    skip_impact: 신용회복위원회 제도 공통 요건인 계속적 소득 여부가 미확인으로 남아 모든 제도가 추가 확인 필요로 표시됩니다.
  - qid: Q5_RECENT_DEBT
    text: 최근 6개월 이내 발생한 신규채무가 있는가?
    kind: bool
    required: false
    skippable: true
    skip_impact: 최근 신규채무 비율을 계산할 수 없어 상담 시 재확인이 필요합니다.

conditional:
  - qid: C1_COLLATERAL
    text: 보유 부동산·자동차·임차보증금이 있는가?
    kind: bool
    required: false
    conditional_on: has_secured_debt
    skippable: true
    skip_impact: 담보채무 관련 제도 판정에 필요한 재산 정보가 미확인으로 남습니다.
  - qid: C2_COLLECTION
    text: 현재 추심 연락을 받고 있는가?
    kind: bool
    required: false
    conditional_on: has_overdue
    skippable: true
    skip_impact: 전문상담 우선 연결(트리아지) 판단에 사용되는 신호가 누락됩니다.
  - qid: C3_INCOME_DROP
    text: 실직·휴업·폐업이 있었는가?
    kind: bool
    required: false
    conditional_on: income_drop_signal
    skippable: true
    skip_impact: 복합지원 상담 연계 여부 판단에 필요한 신호가 누락됩니다.
