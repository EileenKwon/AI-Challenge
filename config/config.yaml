# 채무회복 내비게이터 설정
# 임계치·경로를 코드에 하드코딩하지 않는다 (AGENTS.md 절대 규칙 9)

meta:
  policy_base_date: "2026-08-13"
  service_name: "채무회복 내비게이터"

paths:
  upload_dir: "./uploads"
  policy_card_dir: "./config/policy_cards"
  policy_card_version: "v2026-08-13"
  safety_dir: "./config/safety"
  synthetic_dir: "./data/synthetic"
  questions_file: "./config/questions.yaml"

session:
  ttl_minutes: 60
  max_violations: 3          # 초과 시 자동 응답 중단 → 공식 상담 안내

ingest:
  max_upload_mb: 20
  allowed_mime: ["application/pdf", "image/png", "image/jpeg"]
  min_text_chars: 50         # 페이지당 이 미만이면 스캔본으로 간주

extraction:
  low_confidence_threshold: 0.7   # 미만이면 화면에 경고 표시
  max_debts: 30

reconcile:
  # 필수생활비 하한 임계치 — 2026년 생계급여 선정기준(기준 중위소득 32%).
  # 출처: 보건복지부 「2026년 기준 중위소득 및 생계·의료급여 선정기준과 최저보장수준」
  #       (고시 제2025-135호, 시행 2026-01-01)
  #
  # 가구원수별로 표를 두는 이유: 공식 기준이 선형이 아니다.
  #   1인 820,556 / 2인 1,343,773 (1인의 2배인 1,641,112 가 아니다)
  # 1인 값에 가구원수를 곱하면 2인 가구부터 기준이 22% 높아져 정상 입력에도
  # 경고가 뜬다(거짓 양성). 따라서 표로 조회하고, 표 범위를 넘는 가구는
  # 마지막 두 구간의 증가분을 더해 외삽한다.
  #
  # 이 검사는 결과를 차단하지 않고 재확인만 요청한다.
  living_cost_floor_by_household:
    1: 820556
    2: 1343773
    3: 1714892
    4: 2065123
    5: 2393735
    6: 2704265
  living_cost_check_enabled: true

cashflow:
  currency_unit: "KRW"
  # 부담률 경고 구간 (표시 목적. 제도 판정과 무관)
  dti_warn_ratio: 0.30
  dti_severe_ratio: 0.50

rules:
  allow_unverified_cards: true   # 개발 중에만 true. 배포 전 반드시 false
  max_paths: 3

narrative:
  enabled: true
  max_retries: 1                 # 그라운딩 실패 시 재생성 횟수
  fallback_to_template: true

report:
  max_pages: 1
  font_family: "Noto Sans KR"

logging:
  level: "INFO"
  redact_pii: true
