# 신용정보조회서 필드 동의어 매핑 — 문서상 다양한 표기를 표준 필드명으로 정규화한다.
# key: 표준 필드명, value: 문서에서 관측되는 표기 변형 목록.

balance:
  - 대출잔액
  - 채무잔액
  - 원금잔액
  - 미상환원금
  - 대출금 잔액
  - 잔액

creditor:
  - 금융회사명
  - 채권자
  - 대출기관
  - 거래기관
  - 금융회사

overdue_days:
  - 연체일수
  - 연체기간
  - 연체 일수
  - 연체일

executed_at:
  - 대출실행일
  - 실행일자
  - 개설일
  - 대출일자

is_secured:
  - 담보여부
  - 담보 유무
  - 담보구분
