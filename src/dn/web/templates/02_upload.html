{% extends "_layout.html" %}
{% block title %}업로드{% endblock %}
{% block content %}
<section class="space-y-4 pt-2">
  <h2 class="text-xl font-bold">신용정보조회서 업로드</h2>
  <p class="text-sm text-slate-600">4가지 방식 중 하나를 선택해 주세요.</p>

  <form id="upload-form" class="space-y-3">

    <label class="block rounded-lg border-2 border-slate-200 bg-white p-4 has-[:checked]:border-emerald-500">
      <input type="radio" name="method" value="pdf_upload" checked class="mr-2" />
      <span class="font-semibold text-sm">1. PDF 파일 업로드</span>
      <input type="file" name="file" accept="application/pdf"
             class="mt-2 block w-full text-sm" />
    </label>

    <label class="block rounded-lg border-2 border-slate-200 bg-white p-4 has-[:checked]:border-emerald-500">
      <input type="radio" name="method" value="image_upload" class="mr-2" />
      <span class="font-semibold text-sm">2. 사진(이미지) 업로드</span>
      <input type="file" name="file" accept="image/png,image/jpeg"
             class="mt-2 block w-full text-sm" />
    </label>

    <label class="block rounded-lg border-2 border-slate-200 bg-white p-4 has-[:checked]:border-emerald-500">
      <input type="radio" name="method" value="demo_synthetic" class="mr-2" />
      <span class="font-semibold text-sm">3. 데모용 합성 문서 선택</span>
      <select name="synthetic_case" class="mt-2 block w-full rounded border-slate-300 text-sm">
        <option value="kimhaneul">김하늘 사례 (기획서 15장 데모)</option>
        {% for case in synthetic_cases %}
        <option value="{{ case }}">{{ case }}</option>
        {% endfor %}
      </select>
      <p class="text-xs text-amber-600 mt-1">아직 준비 중입니다 — PDF 또는 이미지 업로드를 이용해 주세요.</p>
    </label>

    <label class="block rounded-lg border-2 border-slate-200 bg-white p-4 has-[:checked]:border-emerald-500">
      <input type="radio" name="method" value="manual_entry" class="mr-2" />
      <span class="font-semibold text-sm">4. 문서 없이 직접 입력</span>
      <p class="text-xs text-slate-500 mt-1">조회서가 없다면 채무 정보를 직접 입력할 수 있습니다.</p>
      <p class="text-xs text-amber-600 mt-1">아직 준비 중입니다 — PDF 또는 이미지 업로드를 이용해 주세요.</p>
    </label>

    <button type="submit"
            class="w-full rounded-lg bg-emerald-600 text-white font-semibold py-3 active:bg-emerald-700">
      업로드하고 다음으로
    </button>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  const method = form.querySelector('input[name="method"]:checked').value;

  if (method !== 'pdf_upload' && method !== 'image_upload') {
    dnShowError(btn, '이 방법은 아직 지원되지 않습니다. "PDF 파일 업로드" 또는 "사진(이미지) 업로드"를 이용해 주세요.');
    return;
  }
  const fileInput = form.querySelector('input[name="method"][value="' + method + '"]')
    .closest('label').querySelector('input[type="file"]');
  const file = fileInput.files[0];
  if (!file) {
    dnShowError(btn, '파일을 선택해 주세요.');
    return;
  }

  const data = new FormData();
  data.append('file', file);

  btn.disabled = true;
  btn.textContent = '업로드 중...';
  try {
    const res = await fetch('/api/session/{{ session_id }}/document', { method: 'POST', body: data });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).detail || ''; } catch (e2) {}
      throw new Error(detail || ('업로드에 실패했습니다 (' + res.status + ')'));
    }
    location.href = '/web/session/{{ session_id }}/extraction';
  } catch (err) {
    dnShowError(btn, err.message);
    btn.disabled = false;
    btn.textContent = '업로드하고 다음으로';
  }
});
</script>
{% endblock %}
